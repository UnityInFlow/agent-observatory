# Monthly, never auto-merged. The API and web app are ordinary software and should stay
# current; the runner deliberately has no dependencies at all.
version: 2
updates:
  - package-ecosystem: maven
    directory: /observatory-api
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    commit-message: { prefix: deps }
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /observatory-web
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    commit-message: { prefix: deps }
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /infra
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencies]
