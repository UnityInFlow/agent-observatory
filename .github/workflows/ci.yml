# Three suites, three jobs, deliberately split.
#
# `make test` runs all three in sequence, which is right locally and wrong here: the runner
# tests take seconds and the API tests take minutes, and a Python typo should not wait behind
# Testcontainers pulling a Postgres image to tell you about itself.
#
# The runner job matters most. Those tests cover the statistics that decide a verdict —
# the §13.1 quality gate, the arm-completeness checks, the MDE table. A bug there does not
# crash; it produces a confident wrong answer, which is the failure mode this whole project
# exists to avoid.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The reviewer is code, and a reviewer that cannot be reviewed is the thing it warns about.
  # These cases stub git, jq and opencode — no network, no tokens, no model call — so the
  # ones asserting the hook did NOT fire cost nothing to keep.
  hook:
    name: the review hook behaves
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check the hooks
        run: for f in .claude/hooks/*.sh; do bash -n "$f" || exit 1; done
      - name: The review hook behaves
        run: ./.claude/hooks/opencode-review.test.sh

  shellcheck:
    name: shell — ShellCheck finds no warnings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Warnings are now enforced, with four suppressions: SC2034 in runner/canary.sh, runner/lib/evaluation-payload.sh and runner/verify-otlp-endpoint-refusal.sh; SC2053 in .claude/hooks/opencode-review.sh.
      - name: ShellCheck the runner
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master as of 2026-09-21, pinned
        with:
          scandir: ./runner
          severity: warning
      - name: ShellCheck the hooks
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master as of 2026-09-21, pinned
        with:
          scandir: ./.claude/hooks
          severity: warning

  runner:
    name: runner — the statistics that decide a verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # No requirements file by design: "this machine has no scipy, and a benchmark harness
      # should not need one." If that ever stops being true, this step is where it shows.
      - name: Run analysis tests
        run: python3 -m unittest discover -s runner -p 'test_*.py' -v
      # A fixture set nobody executes is L3 — words a human chooses to run. The layer
      # table in phases/05b-verification-selfhealing/README.md calls this verifier L2
      # "because it executes in CI and fails the build", and until this step existed that
      # sentence was false: NO runner/verify-*.sh ran in CI. It needs only bash and jq, both
      # preinstalled on ubuntu-latest — no codex, no model call, no network.
      - name: The permission-block classifier refuses what it must
        run: ./runner/verify-permission-block-classifier.sh
      # The refusal half of the OTLP preflight: an empty endpoint and a closed 127.0.0.1 port,
      # both protocols. Needs only bash and curl — no collector, no model call. The second
      # line proves the verifier can fail: pointed at a library that admits everything, it must.
      - name: The runner refuses an OTLP endpoint that does not answer
        run: |
          ./runner/verify-otlp-endpoint-refusal.sh
          ! OTLP_PREFLIGHT_LIB=runner/fixtures/otlp-preflight-always-admits.sh ./runner/verify-otlp-endpoint-refusal.sh
      # Two more fixture sets that were L3 until they ran here: the init-record schema check
      # (a tools: file is not the treatment until its init record says so) and the skill
      # contamination guard (which once excluded the treatment arm). Bash and jq only — no
      # model call, no network.
      - name: The init-record schema check refuses what it must
        run: ./runner/verify-init-schema-check.sh
      - name: The skill contamination guard admits the treatment and refuses the rest
        run: ./runner/verify-skill-contamination.sh

  policy:
    name: runner — the schema-verdict policy still refuses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its own job rather than a step of `runner`: this fixture set reads two tracked files
    # under ../agent-learning-lab, and actions/checkout cannot write outside the workspace,
    # so both repositories are checked out side by side underneath it. Bash and jq only,
    # both preinstalled — no model call, no docker, no network beyond the two checkouts.
    steps:
      - uses: actions/checkout@v7
        with:
          path: agent-observatory
      # The sibling is checked out at `main`, which moves: a lab commit can turn this job red.
      - uses: actions/checkout@v7
        with:
          repository: UnityInFlow/agent-learning-lab
          ref: main
          path: agent-learning-lab
      - name: The schema-verdict policy refuses what it must
        run: bash runner/verify-schema-verdict-policy.sh
        working-directory: agent-observatory

  web:
    name: web — type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: observatory-web/package-lock.json
      - name: Install
        working-directory: observatory-web
        run: npm ci
      - name: Lint
        working-directory: observatory-web
        run: npm run lint
      - name: Type-check and build
        working-directory: observatory-web
        run: npm run build

  api:
    name: api — Spring Boot with Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      # Testcontainers starts a real PostgreSQL. ubuntu-latest ships a running Docker
      # daemon, so nothing extra is needed — but the first run pays for the image pull.
      - name: Run API tests
        working-directory: observatory-api
        run: ./mvnw -B test
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: observatory-api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
