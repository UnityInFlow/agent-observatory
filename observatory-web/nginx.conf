server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API proxy, so the browser never needs CORS and the app behaves
    # identically under `make up` and the Vite dev server.
    location /api/ {
        proxy_pass         http://observatory-api:8080/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
