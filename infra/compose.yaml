# Agent Observatory — complete local ecosystem.
#
# Brought up by `make up` from the repository root. Image tags are pinned on purpose:
# chapter 00 section 10 explicitly rejects teaching `latest` as a deployment practice.
#
#   otel-collector  4317 (gRPC) / 4318 (HTTP) / 8889 (Prometheus scrape)
#   tempo           3200
#   prometheus      9090
#   grafana         3000
#   postgres        5432
#   observatory-api 8080
#   observatory-web 5173

name: agent-observatory

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: observatory
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: observatory
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatory -d observatory"]
      interval: 5s
      timeout: 5s
      retries: 20

  tempo:
    image: grafana/tempo:2.6.1
    # Local learning stack only: root avoids named-volume ownership friction.
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3200/ready | grep -q ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      # Agent events land here for the Claude/Codex adapters to read (see config.yaml).
      - ./telemetry-out:/var/telemetry
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${COLLECTOR_METRICS_PORT:-8889}:8889"
    depends_on:
      tempo:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # Anonymous admin keeps the "one click" promise for a local learning stack.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - tempo
      - prometheus

  observatory-api:
    build:
      context: ../observatory-api
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/observatory
      SPRING_DATASOURCE_USERNAME: observatory
      SPRING_DATASOURCE_PASSWORD: observatory
      # Must be the HOST port: this URL is handed to the browser for trace deep links.
      OBSERVATORY_GRAFANA_BASE_URL: http://localhost:${GRAFANA_PORT:-3000}
      OBSERVATORY_TEMPO_DATASOURCE_UID: tempo
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30

  observatory-web:
    build:
      context: ../observatory-web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      observatory-api:
        condition: service_healthy

volumes:
  postgres-data:
  tempo-data:
  prometheus-data:
  grafana-data:
