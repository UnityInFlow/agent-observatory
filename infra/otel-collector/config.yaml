# Vendor-neutral ingest point for Copilot CLI, Claude Code and Codex telemetry.
#
# Privacy note (chapter 00 section 5): this collector is metadata-only. The attribute
# processor below deletes prompt/response/tool bodies even if a runtime is misconfigured
# and sends them, so a single wrong env var on a laptop cannot exfiltrate source code.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

  # Defence in depth: drop content-bearing attributes regardless of client config.
  attributes/scrub:
    actions:
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      # Developer identity. Claude Code's own documentation notes OAuth telemetry can
      # carry user.email, and its log events additionally carry a stable user.id, account
      # UUIDs, the organization id and the terminal app. §28: the purpose is to evaluate
      # the *system*, not to rank developers — and none of this is needed for that.
      # Doubly important now that events are persisted to disk for the adapters to read.
      - key: user.email
        action: delete
      - key: user.id
        action: delete
      - key: user.account_id
        action: delete
      - key: user.account_uuid
        action: delete
      - key: organization.id
        action: delete
      - key: terminal.type
        action: delete
      - key: tool.arguments
        action: delete
      - key: tool.result
        action: delete
      - key: code.content
        action: delete

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    # Promote only low-cardinality dimensions to labels (section 15).
    resource_to_telemetry_conversion:
      enabled: false

  # Claude Code and Codex report agent activity as OTel *log events*, not spans (§25/§26).
  # There is no trace to query them back out of, so events are written to a file the
  # adapters can read per run. This is the "normalize logs, do not fake trace parity"
  # path — the alternative would be inventing a span hierarchy that never existed.
  file/events:
    path: /var/telemetry/events.jsonl
    rotation:
      max_megabytes: 32
      max_backups: 3

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [file/events, debug]

  telemetry:
    logs:
      level: info
